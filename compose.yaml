# LOCAL DEVELOPMENT ONLY: no TLS termination or production secret manager.
# cp .env.compose.example .env, then edit it. Run: docker compose up --build -d
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quran_academy
      MYSQL_USER: quran_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      retries: 12
      start_period: 30s
  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &api_env
      NODE_ENV: development
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: quran_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: quran_academy
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PRIVATE_UPLOAD_DIR: /app/private_uploads
      ACADEMY_COMMISSION_BPS: ${ACADEMY_COMMISSION_BPS:-2000}
    volumes:
      - private_docs:/app/private_uploads
    ports:
      - "127.0.0.1:4000:4000"
  reminders:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *api_env
    command: ["node","src/reminder_worker.js"]
volumes:
  mysql_data:
  private_docs:
